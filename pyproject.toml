[project]
name = "short-video-intelligence-lab"
version = "0.1.0"
description = "Research and engineering scaffold for short-video collection, visual analysis, and speech/script processing."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "OpenAI Codex" }
]
dependencies = [
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
asr = [
  "faster-whisper>=1.0",
]
ocr = [
  "easyocr>=1.7",
]
ocr-paddle = [
  "paddleocr>=2.7",
]
multimodal = [
  "faster-whisper>=1.0",
  "easyocr>=1.7",
  "opencv-contrib-python>=4.13",
  "mediapipe>=0.10",
]
vision-person = [
  "opencv-contrib-python>=4.13",
  "mediapipe>=0.10",
]

[project.scripts]
short-video-intel = "short_video_intel.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
