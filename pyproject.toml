[project]
name = "short-video-intelligence-lab"
version = "0.1.0"
description = "Research and engineering scaffold for short-video collection, visual analysis, and speech/script processing."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "OpenAI Codex" }
]
dependencies = [
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
]

[project.scripts]
short-video-intel = "short_video_intel.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
